# Render blueprint. New → Blueprint → point it at this repository.
#
# Static site, not a web service: the page is prerendered HTML plus a
# pre-built image ladder, so nothing needs to run at request time. No cold
# starts, no instance to keep awake.
services:
  - type: web
    runtime: static
    name: shawarmalu
    branch: main
    # --include=dev is not optional: Render sets NODE_ENV=production, and a bare
    # npm ci would then skip typescript, tailwind and sharp, and the build fails.
    # `npm run build` cuts the image ladder with sharp before next build.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
    headers:
      # hashed by Next, safe to cache forever
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # width is in the filename, so a changed image is a changed URL
      - path: /img/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /media/*
        name: Cache-Control
        value: public, max-age=604800
